services:
  mongodb:
    image: mongo:7.0
    container_name: medibridge-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: medibridge
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { const h = db.hello(); if (h.isWritablePrimary) { quit(0); } const st = rs.status(); if (!st.ok) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); } quit(1); } catch (e) { try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); } catch (_) {} quit(1); }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medibridge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      FRONTEND_URL: http://localhost
      MONGODB_URI: mongodb://mongodb:27017/medibridge?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?PHI_ENCRYPTION_KEY is required}
      ACTION_TOKEN_SECRET: ${ACTION_TOKEN_SECRET:?ACTION_TOKEN_SECRET is required}
      PRESCRIPTION_SIGNING_KEY: ${PRESCRIPTION_SIGNING_KEY:?PRESCRIPTION_SIGNING_KEY is required}
      STORAGE_LOCAL_DIR: /app/uploads/secure_records
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    volumes:
      - backend_uploads:/app/uploads/secure_records
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medibridge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medibridge-net

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  medibridge-net:
    driver: bridge
